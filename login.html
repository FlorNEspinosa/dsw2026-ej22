<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login_style.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="login.js"></script>
</head>
<body>
    <div class="login-container">
        <section class="login-header">
            <i data-lucide="shield-check"></i>
            <h1>MedPortal</h1>
        </section>

        <div class="login-main">
            <form id="adminLoginForm">
                <strong>Bienvenido de nuevo</strong>
                <p>Por favor, autentíquese para acceder al portal de proveedores.</p>

                <div class="form-field">
                    <label for="username">Nombre de usuario</label>
                    <div class="input-container">
                        <i data-lucide="user-round"></i>
                        <input type="text" id="username" name="username" placeholder="Ingrese ID de admin" required>
                    </div>
                </div>

                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <div class="input-container">
                        <i data-lucide="lock-keyhole"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <i data-lucide="eye" id="toggle-password"></i>
                    </div>
                </div>

                <p id="error-message" style="color: #d9534f; font-size: 0.85rem; margin-bottom: 10px;"></p>

                <button id="submit" type="submit">
                    Iniciar Sesión
                    <i data-lucide="log-out"></i>
                </button>
            </form>
            <section class="login-footer">
                <i data-lucide="shield-check"></i>
                <p>
                    <strong>Solo Acceso Seguro:</strong>
                    Este sistema es para personal médico autorizado.
                    Los intentos de acceso no autorizados son registrados
                    y monitoreados para su cumplimiento.
                </p>
            </section>
        </div>
    </div>
    <script>
            lucide.createIcons();
    </script>
</body>
</html>
